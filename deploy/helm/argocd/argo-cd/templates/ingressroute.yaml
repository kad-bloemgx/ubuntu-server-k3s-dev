{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingressroute
  namespace: argo-cd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      {{- if .Values.inFlightReq.enabled }}
      middlewares:
        - name: in-flight-req
          namespace: {{ .Release.Namespace }}
      {{- end }}
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: myresolver
{{- end }}
