backstage:
  backstage:
    image:
      tag: latest

    # Load the demo image's built-in config first, then layer our overrides on
    # top. Without this, setting appConfig would replace the command and drop
    # the baked-in guest auth, base URLs, CORS/CSP and catalog config.
    args:
      - "--config"
      - "/app/app-config.yaml"

    # Layer an extra app-config on top of the demo image's built-in config.
    # Enable guest auth for this demo deployment and configure its database
    # and catalog. Base URLs stay as provided by the demo image. The chart
    # injects POSTGRES_* env vars when postgresql.enabled is true.
    appConfig:
      auth:
        providers:
          guest:
            # Anonymous access: only use in a restricted demo environment.
            dangerouslyAllowOutsideDevelopment: true
      backend:
        database:
          client: pg
          connection:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
      catalog:
        locations:
          - type: url
            target: https://raw.githubusercontent.com/kad-bloemgx/ubuntu-server-k3s-dev/main/catalog-info.yaml
            rules:
              - allow: [System, Component, User]

  # Bundled Bitnami PostgreSQL subchart, providing persistent storage so the
  # catalog survives pod restarts. Credentials come from an existing Secret
  # created out-of-band (NOT in git, since this repo is public).
  postgresql:
    enabled: true
    auth:
      username: bn_backstage
      database: backstage
      existingSecret: backstage-postgresql
    primary:
      persistence:
        enabled: true
        size: 8Gi
