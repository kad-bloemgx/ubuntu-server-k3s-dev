pgadmin4:
  nameOverride: pgadmin
  fullnameOverride: pgadmin

  env:
    email: admin@gerardbloemendaal.freemyip.com
    # Wachtwoord komt uit een handmatig aangemaakte Secret, niet uit git.
    variables:
      - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
        value: "True"

  existingSecret: pgadmin-credentials
  secretKeys:
    pgadminPasswordKey: password

  # Zorgt dat de PostgreSQL-server automatisch klaarstaat bij eerste opstart,
  # zonder wachtwoord in git: het wachtwoord komt uit een gemount pgpass-bestand
  # (Secret "postgresql-pgpass", handma/home/gerardb/IdeaProjects/kadaster/dhub/ubuntu-server-k3s-dev/deploy/helm/argocdtig aangemaakt, niet in git).
  serverDefinitions:
    enabled: true
    resourceType: ConfigMap
    servers:
      1:
        Name: "PostgreSQL"
        Group: "Servers"
        Host: "postgresql.postgresql.svc.cluster.local"
        Port: 5432
        MaintenanceDB: "appdb"
        Username: "appuser"
        SSLMode: "prefer"
        ConnectionParameters:
          passfile: "/var/lib/pgadmin/storage/pgpassfile"

  extraSecretMounts:
    - name: postgresql-pgpass
      secret: postgresql-pgpass
      subPath: pgpass
      mountPath: /var/lib/pgadmin/storage/pgpassfile
      readOnly: true

  ingress:
    enabled: false

  # De chart-eigen NetworkPolicy laat al het verkeer op de poort toe en is
  # daarom vervangen door de policies in templates/networkpolicy.yaml.
  networkPolicy:
    enabled: false

  service:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  host: pgadmin.gerardbloemendaal.freemyip.com

networkPolicy:
  enabled: true
  # Poort waarop de pgAdmin-container luistert (service targetPort).
  targetPort: 80
  # Namespaces die de pgAdmin-webinterface mogen benaderen.
  allowedIngressNamespaces:
    - traefik

# Maximaal aantal gelijktijdig lopende verzoeken per client-IP. Beschermt tegen
# het leegtrekken van verbindingen; rate limiting doet dat niet. Apps die lang
# openstaande verbindingen gebruiken, zoals Headlamp met zijn watches, hebben
# deze begrenzing bewust niet.
inFlightReq:
  enabled: true
  amount: 100
