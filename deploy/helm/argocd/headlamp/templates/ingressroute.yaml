kind: IngressRoute
apiVersion: traefik.io/v1alpha1

metadata:
  name: headlamp-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls:
    certResolver: myresolver
