headlamp:
  fullnameOverride: headlamp

  # The chart's built-in binding defaults to cluster-admin; use the explicit
  # read-only ClusterRole and binding rendered by this wrapper instead.
  clusterRoleBinding:
    create: false

  config:
    inCluster: true
    # Use the pod's ServiceAccount token so logging in to the UI works without
    # manually pasting a token. The bound ClusterRole is read-only.
    unsafeUseServiceAccountToken: true

  service:
    type: ClusterIP
    port: 80

ingress:
  host: headlamp.gerardbloemendaal.freemyip.com

rbac:
  create: true
  serviceAccountName: headlamp-user
