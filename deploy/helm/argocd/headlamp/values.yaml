headlamp:
  fullnameOverride: headlamp

  # The chart's built-in binding defaults to cluster-admin; use the explicit
  # read-only ClusterRole and binding rendered by this wrapper instead.
  clusterRoleBinding:
    create: false

  config:
    inCluster: true
    unsafeUseServiceAccountToken: false

  service:
    type: ClusterIP
    port: 80

ingress:
  host: headlamp.gerardbloemendaal.freemyip.com

rbac:
  create: true
  serviceAccountName: headlamp-user
